# Sveltia CMS-configuratie — beheerscherm op /admin/
#
# Voor online gebruik (na deploy): vul hieronder je GitHub-gebruikersnaam/repo in.
# Voor lokaal gebruik: draai `npm run dev`, open http://localhost:8080/admin/
# en kies "Work with Local Repository" (werkt in Chrome/Edge).

backend:
  name: github
  repo: jjdb77/tubes-website
  branch: main

site_url: https://www.tubes.media
media_folder: src/assets/images
public_folder: /assets/images

# Herbruikbare knop-velden
_button_fields: &button_fields
  - { label: Knoptekst, name: label, widget: string }
  - { label: Link (URL), name: url, widget: string }

collections:
  - name: instellingen
    label: Site-instellingen
    icon: settings
    files:
      - name: algemeen
        label: Algemeen (logo, contact, footer, menu)
        file: src/_data/settings.json
        fields:
          - { label: Sitenaam, name: site_name, widget: string }
          - { label: Slogan, name: tagline, widget: string }
          - { label: Site-URL, name: site_url, widget: string, hint: "Zonder slash aan het einde, bijv. https://www.tubes.media" }
          - { label: Logo, name: logo, widget: image }
          - { label: Footertekst, name: footer_text, widget: text }
          - { label: Standaard knoptekst (CTA), name: cta_label, widget: string }
          - { label: Standaard knoplink (CTA), name: cta_url, widget: string }
          - { label: Knoptekst in de kop, name: header_cta_label, widget: string, required: false, hint: "De knop rechtsboven op elke pagina. Leeg = de standaard knoptekst." }
          - { label: Knoplink in de kop, name: header_cta_url, widget: string, required: false, hint: "Leeg = de standaard knoplink." }
          - { label: "Tubes app-URL (plan kiezen)", name: app_url, widget: string, hint: "Nu nog demo.tubesmedia.online, straks app.tubesmedia.online" }
          - { label: "Boekingslink (Book a call)", name: booking_url, widget: string, hint: "Basisadres van de afsprakenpagina, zonder afspraaktype. Nu 4relations.appconnected.nl/boek/joachim" }
          - { label: "Agenda in de popover (Health Check)", name: booking_embed_url, widget: string, required: false, hint: "De boekingspagina van het afspraaktype, die in het venstertje op de Health Check-pagina wordt getoond. LET OP: hier hoort .../boek/<account>/<slug>, nooit een losse afspraaklink .../afspraak/<id> — die toont de naam, het e-mailadres en het telefoonnummer van degene die geboekt heeft. Leeg = geen popover, de knop opent gewoon de boekingspagina." }
          - label: "Boekingslinks per plan"
            name: booking_plans
            widget: list
            hint: "Elke regel wordt een pagina /book-a-call/<pad>/ die doorstuurt naar het afspraaktype. Laat het pad leeg voor de algemene link /book-a-call/."
            fields:
              - { label: "Pad op de website (leeg = algemeen)", name: path, widget: string, required: false, hint: "Bijvoorbeeld: producer-pro/ (met schuine streep aan het eind)" }
              - { label: "Afspraaktype in 4Relations", name: slug, widget: string, hint: "Het deel achter de laatste schuine streep van de boekingslink, bv. tubes-producer-pro" }
              - { label: "Plannaam bij de boeking", name: plan, widget: string, required: false, hint: "Komt bovenaan de opmerkingen van de boeking te staan, bv. Producer Pro" }
          - label: Contactgegevens
            name: contact
            widget: object
            fields:
              - { label: E-mailadres, name: email, widget: string }
              - { label: Telefoonnummer, name: phone, widget: string }
              - { label: Adresregels, name: address_lines, widget: list, field: { label: Regel, name: line, widget: string } }
          - label: Bedrijfsgegevens (footer "Legal")
            name: legal
            widget: object
            fields:
              - { label: Bedrijfsnaam, name: company, widget: string }
              - { label: Land, name: country, widget: string }
              - { label: KvK-nummer, name: coc, widget: string }
              - { label: BTW-nummer, name: vat, widget: string }
              - { label: Logo, name: logo, widget: image, required: false }
          - label: Social media
            name: socials
            widget: object
            fields:
              - { label: LinkedIn-URL, name: linkedin, widget: string, required: false }
              - { label: YouTube-URL, name: youtube, widget: string, required: false }
          - { label: "Formulier-endpoint (Formspree/Web3Forms)", name: form_endpoint, widget: string, required: false, hint: "Leeg = formulier opent het e-mailprogramma van de bezoeker. Zie README voor uitleg." }
          - { label: "GoatCounter-code (bezoekersstatistieken)", name: goatcounter, widget: string, required: false, hint: "Maak gratis een account op goatcounter.com en vul hier je code in (het deel vóór .goatcounter.com). Cookieloos, dus geen cookiebanner nodig. Leeg = uit." }
          - { label: "Google Analytics 4 meet-ID", name: google_analytics, widget: string, required: false, pattern: ["^$|^G-[A-Z0-9]{6,}$", "Leeg laten of een ID in de vorm G-XXXXXXXXXX"], hint: "De code uit je GA4-property, in de vorm G-XXXXXXXXXX. LET OP: Google Analytics zet cookies, dus dit veld pas invullen als er een cookiebanner op de site staat en hoofdstuk 10 van /privacy/ is bijgewerkt. Leeg = uit." }
          - label: Menu
            name: nav
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Naam, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - label: "Links in de footer"
            name: footer_nav
            widget: list
            summary: "{{fields.label}}"
            hint: "Alle pagina's op een rij onderaan de site. Google gebruikt deze links om pagina's te vinden die niet in het menu staan (Platform en Plans)."
            fields:
              - { label: Naam, name: label, widget: string }
              - { label: Link, name: url, widget: string }

      - name: healthcheck
        label: "Health Check-vragenlijst"
        file: src/_data/healthcheck.json
        description: "De vragen op /production-finance-health-check/assessment/. Let op: de sleutel van een vraag is de veldnaam in de opslag. Verander die niet meer zodra er antwoorden binnen zijn, dan raken oude en nieuwe antwoorden los van elkaar."
        fields:
          - { label: "Introzin boven het formulier", name: intro, widget: text }
          - label: "Stap 1 (je gegevens)"
            name: step1
            widget: object
            fields:
              - { label: "Naam van de stap", name: title, widget: string }
              - { label: Kop, name: heading, widget: string }
          - label: "Stap 2 (je werkwijze)"
            name: step2
            widget: object
            fields:
              - { label: "Naam van de stap", name: title, widget: string }
              - { label: Kop, name: heading, widget: string }
          - { label: "Label bij het rolveld", name: role_label, widget: string }
          - label: "Vragen"
            name: questions
            widget: list
            summary: "{{fields.label}}"
            hint: "Elke vraag is één rij keuzeknoppen. Een vraag toevoegen kan gewoon; de pagina, de opslag, /beheer en de export lopen mee."
            fields:
              - { label: "Sleutel (veldnaam in de opslag)", name: key, widget: string, pattern: ['^[a-z][a-z0-9_]*$', "Alleen kleine letters, cijfers en liggende streepjes"], hint: "NIET meer wijzigen zodra er antwoorden binnen zijn." }
              - { label: Vraag, name: label, widget: string }
              - { label: Keuzes, name: options, widget: list, field: { label: Keuze, name: option, widget: string }, hint: "Alleen deze waarden worden opgeslagen; iets anders wordt geweigerd." }
              - { label: "Meer antwoorden mogelijk", name: multiple, widget: boolean, default: false, required: false, hint: "Aan = vinkjes in plaats van één keuze. De antwoorden komen als lijst binnen, gescheiden door komma's." }
          - label: "Vrij tekstveld onderaan"
            name: notes
            widget: object
            fields:
              - { label: Vraag, name: label, widget: string }
              - { label: "Voorbeeldtekst in het veld", name: placeholder, widget: text }
          - label: "Na het versturen"
            name: result
            widget: object
            fields:
              - { label: "Kop boven de agenda", name: book_title, widget: string }
              - { label: "Tekst bij de agenda", name: book_text, widget: text }
              - { label: "Tekst op de knop", name: book_label, widget: string }
              - { label: "Kop boven het overzicht", name: heading, widget: string }
              - { label: "Kop boven 'waar we beginnen'", name: focus_title, widget: string }
              - { label: "Kop in de rechterkolom", name: next_title, widget: string }
              - { label: "Stappen in de rechterkolom", name: next, widget: list, field: { label: Regel, name: line, widget: string } }
              - { label: "Slotzin rechts", name: note, widget: text }

  - name: artikelen
    label: "Artikelen (Insights)"
    icon: draft
    folder: src/content/insights
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Sjabloon, name: layout, widget: hidden, default: article.njk }
      - { label: Titel, name: title, widget: string, hint: "Dit wordt de kop op de pagina (H1)." }
      - { label: Introzin, name: standfirst, widget: text, hint: "Dikgedrukte zin onder de titel, en de samenvatting in het overzicht." }
      - { label: Publicatiedatum, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "URL-pad", name: permalink, widget: string, hint: "Bijv. /insights/mijn-artikel/ — begin en eindig met een slash." }
      - { label: Artikel, name: body, widget: markdown, hint: "Gebruik ## voor tussenkoppen. Geen em-dashes (—) gebruiken." }
      # --- Vindbaarheid in Google (SEO) ---
      - { label: "SEO: titel in Google", name: seo_title, widget: string, required: false, hint: "Max ± 60 tekens, zoekwoorden vooraan. Leeg = 'Titel | Tubes'." }
      - { label: "SEO: omschrijving in Google", name: description, widget: text, required: false, hint: "Max ± 155 tekens." }
      - { label: "SEO: deelplaatje (LinkedIn, WhatsApp)", name: og_image, widget: image, required: false }
      - { label: "SEO: artikel uit Google houden", name: noindex, widget: boolean, default: false, required: false }

  - name: nieuws
    label: "Nieuws (/news/)"
    icon: newspaper
    folder: src/content/news
    format: yaml-frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Geen eigen pagina (laat op uit)", name: permalink, widget: hidden, default: false }
      - { label: Samenvatting, name: summary, widget: text, hint: "Twee of drie zinnen; dit is de hele tekst op de nieuwspagina." }
      - { label: "Link (bijv. /compare-film-tv-locations/ of een externe URL)", name: url, widget: string, required: false }
      - { label: Linktekst, name: link_label, widget: string, required: false, hint: "Leeg = 'Read more'" }

  - name: linkedin
    label: "Branchenieuws van LinkedIn"
    icon: rss_feed
    folder: src/content/linkedin
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Auteur of organisatie", name: source, widget: string, hint: "Wie het schreef. Dit staat het grootst op de kaart, want de post is van hen." }
      - { label: "Functie of organisatie", name: role, widget: string, required: false, hint: "Bijv. 'Producer and production consultant'. Alleen invullen als je het zeker weet; leeg laten is beter dan gokken." }
      - { label: "Kop boven de samenvatting", name: title, widget: string, hint: "Het onderwerp van de post, in het Engels, en geen stelling. Dus 'Film budgets and the assumptions behind them', niet 'Why assumptions matter'. Geen em-dashes (—)." }
      - label: Onderwerp (het gekleurde labeltje)
        name: topic
        widget: select
        default: Budgeting
        options: [Budgeting, Financing, "AI in production", Festivals]
      - { label: "Link naar de LinkedIn-post", name: link, widget: string, required: false, hint: "Liefst de post zelf (op LinkedIn: de drie puntjes bij de post > 'Copy link to post'); dan wordt de knop 'Read <naam>'s original post'. Een berichtenoverzicht (/recent-activity/all/ of /company/<naam>/posts/) geeft 'See <naam>'s posts', een kale profielpagina 'See more from <naam>'. Leeg mag ook: dan geen knop." }
      - { label: Datum, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Bepaalt de volgorde en de maandkop. Op de pagina staat alleen de maand." }
      - { label: Samenvatting, name: body, widget: markdown, hint: "Een of twee zinnen in het Engels. Beschrijf waar de post over gaat ('Katya Alexander writes about ...'), niet wat de auteur vindt: geen 'argues', 'makes the case' of 'flags'. Zo blijft het standpunt van de auteur en blijft de post zelf de plek voor het volledige verhaal. Geen em-dashes (—)." }
      - { label: "Geen eigen pagina (laat op uit)", name: permalink, widget: hidden, default: false }

  - name: paginas
    label: Pagina's
    icon: article
    folder: src/content/pages
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - { label: Sjabloon, name: layout, widget: hidden, default: layout.njk }
      - { label: Paginatitel, name: title, widget: string }
      - { label: "URL-pad", name: permalink, widget: string, hint: "Bijv. /platform/ — begin en eindig met een slash. Homepagina: /" }
      # --- Vindbaarheid in Google (SEO) ---
      - { label: "SEO: titel in Google", name: seo_title, widget: string, required: false, hint: "Max ± 60 tekens, belangrijkste zoekwoorden vooraan. Leeg = 'Paginatitel | Tubes'." }
      - { label: "SEO: omschrijving in Google", name: description, widget: text, required: false, hint: "Max ± 155 tekens. Het grijze tekstje onder de blauwe link in de zoekresultaten." }
      - { label: "SEO: deelplaatje (LinkedIn, WhatsApp)", name: og_image, widget: image, required: false, hint: "1200 x 630 pixels. Leeg = het standaard Tubes-plaatje." }
      - { label: "SEO: pagina uit Google houden", name: noindex, widget: boolean, default: false, required: false }
      - { label: "SEO: productgegevens meesturen (prijzen, functies)", name: schema_software, widget: boolean, default: false, required: false, hint: "Aan op Home, Platform en Plans. Google toont dan prijs- en productinfo bij de zoekresultaten." }
      - label: Secties
        name: sections
        widget: list
        types:
          - name: hero
            label: "Hero (paginakop)"
            summary: "{{fields.title}}"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Licht, value: light}, {label: Donker, value: dark}], default: light }
              - { label: "Bovenregel (klein, in hoofdletters)", name: kicker, widget: string, required: false }
              - { label: Titel, name: title, widget: string, hint: "Zet *sterretjes* om een woord voor de accentkleur, bijv: in *one platform*" }
              - { label: Tekst, name: text, widget: markdown }
              - label: "Status-chips (pijplijn, optioneel)"
                name: chips
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Tekst, name: label, widget: string }
                  - { label: Kleur, name: tone, widget: select, options: [teal, blue, amber, mint, lavender], default: teal }
              - { label: "Knoppen rechts naast de tekst (alleen zonder beeld)", name: buttons_position, widget: select, options: [{label: "Onder de tekst", value: ""}, {label: "Rechts naast de tekst", value: side}], required: false }
              - { label: "Minder witruimte onder de hero", name: tight, widget: boolean, required: false, default: false }
              - label: Knoppen
                name: buttons
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields: *button_fields
              - { label: Afbeelding, name: image, widget: image, required: false }
              - { label: "Afbeelding: alt-tekst", name: image_alt, widget: string, required: false }
              - { label: "Video (mp4)", name: video, widget: file, required: false }
              - { label: "Video: posterafbeelding", name: poster, widget: image, required: false }
          - name: split
            label: "Twee kolommen"
            summary: "Twee kolommen"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: white }
              - label: Kolommen
                name: columns
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Kop, name: heading, widget: string, required: false }
                  - { label: "Vette introzin", name: lead, widget: string, required: false }
                  - { label: Tekst, name: text, widget: markdown }
          - name: feature
            label: "Tekst + beeld/video"
            summary: "{{fields.heading}}"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: light }
              - { label: Kop, name: heading, widget: string, required: false }
              - { label: "Vette introzin", name: lead, widget: string, required: false }
              - { label: Tekst, name: text, widget: markdown }
              - { label: Afbeelding, name: image, widget: image, required: false }
              - { label: "Afbeelding: alt-tekst", name: image_alt, widget: string, required: false }
              - { label: "Video (mp4)", name: video, widget: file, required: false }
              - { label: "Video: posterafbeelding", name: poster, widget: image, required: false }
              - { label: "Video automatisch afspelen (zonder geluid, in een loop)", name: ambient, widget: boolean, default: false, required: false }
              - { label: "Beeld links (i.p.v. rechts)", name: media_position, widget: select, options: [{label: Rechts, value: right}, {label: Links, value: left}], default: right, required: false }
              - { label: "Onderschrift bij beeld", name: media_caption, widget: string, required: false }
              - { label: Knop, name: button, widget: object, required: false, collapsed: true, fields: *button_fields }
          - name: cards
            label: "Kaarten (2 of 3 naast elkaar)"
            summary: "{{fields.heading}}"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: white }
              - { label: Kop boven de kaarten, name: heading, widget: string, required: false }
              - { label: Introtekst, name: intro, widget: markdown, required: false }
              - { label: Aantal kolommen, name: columns, widget: select, options: [{label: "2", value: 2}, {label: "3", value: 3}], default: 3 }
              - label: Kaarten
                name: cards
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Icoon (svg uit assets/icons)", name: icon, widget: image, required: false }
                  - { label: Kop, name: heading, widget: string }
                  - { label: Tekst, name: text, widget: markdown }
                  - { label: "Afbeelding bovenin de kaart (i.p.v. icoon)", name: image, widget: image, required: false, hint: "Eigen upload, of een volledige https-URL (bijv. Wikimedia Commons-thumbnail)." }
                  - { label: "Afbeelding: alt-tekst", name: image_alt, widget: string, required: false }
                  - { label: "Afbeelding: credit (maker, licentie)", name: image_credit, widget: string, required: false, hint: "Verplicht bij Commons-foto's, bijv. 'Photo: Naam (CC BY-SA 4.0)'. Markdown-links mogen." }
                  - { label: "Afbeeldingsstijl", name: image_style, widget: select, options: [{label: "Foto", value: ""}, {label: "Contourkaart (lijntekening)", value: contour}], required: false }
                  - { label: "Link (maakt de hele kaart klikbaar, bijv. /resources/)", name: url, widget: string, required: false }
                  - { label: "Linktekst (bijv. Open the guide)", name: link_label, widget: string, required: false }
          - name: textblock
            label: Tekstblok
            summary: "{{fields.heading}}"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: white }
              - { label: Kop, name: heading, widget: string, required: false }
              - { label: "Vette introzin", name: lead, widget: string, required: false }
              - { label: Tekst, name: text, widget: markdown }
              - { label: "Tekst in 2 kolommen", name: two_column, widget: boolean, default: false, required: false }
              - { label: "Smalle breedte", name: narrow, widget: boolean, default: false, required: false }
              - { label: "Gewone opsommingstekens (geen vinkjes)", name: plain_list, widget: boolean, default: false, required: false }
          - name: images
            label: Afbeeldingenrij
            summary: "Afbeeldingenrij"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: white }
              - label: Afbeeldingen
                name: images
                widget: list
                summary: "{{fields.alt}}"
                fields:
                  - { label: Afbeelding, name: image, widget: image }
                  - { label: Alt-tekst, name: alt, widget: string }
                  - { label: Onderschrift, name: caption, widget: string, required: false }
          - name: pricing
            label: Abonnementen
            summary: "Abonnementen"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: light }
              - { label: Kop, name: heading, widget: string, required: false }
              - { label: Introtekst, name: intro, widget: markdown, required: false }
              - label: Abonnementen
                name: plans
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Naam, name: name, widget: string }
                  - { label: "Badge (bijv. Most popular)", name: badge, widget: string, required: false }
                  - { label: Omschrijving, name: text, widget: markdown }
                  - { label: "Voor de prijs (bijv. From)", name: price_prefix, widget: string, required: false }
                  - { label: "Prijs (bijv. € 49)", name: price, widget: string, required: false }
                  - { label: "Prijstoelichting (bijv. per user/month)", name: price_note, widget: string, required: false }
                  - { label: "Extra prijsinfo", name: price_detail, widget: markdown, required: false }
                  - { label: "Kenmerken (opsomming met -)", name: features, widget: markdown, required: false }
                  - { label: Knop, name: button, widget: object, required: false, fields: *button_fields }
              - { label: Voetnoot onder de abonnementen, name: footnote, widget: markdown, required: false }
          - name: cta
            label: "Donkerblauwe call-to-action"
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Tekst, name: text, widget: markdown }
              - { label: Knop, name: button, widget: object, required: false, fields: *button_fields }
          - name: healthcheck
            label: "Health Check-blok"
            summary: "Health Check"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [light, white, teal], default: white, required: false }
            hint: "De teksten van dit blok staan onder Health Check-vragenlijst, niet hier."
          - name: contactform
            label: Contactformulier
            summary: "Contactformulier"
            fields:
              - { label: Kop, name: heading, widget: string, default: Contact form }
              - { label: Tekst boven het formulier, name: text, widget: markdown, required: false }
          - name: tour
            label: "Module-tour (tabs met screenshots)"
            summary: "{{fields.heading}}"
            fields:
              - { label: Achtergrond, name: theme, widget: select, options: [{label: Wit, value: white}, {label: Lichtgrijs, value: light}, {label: Lichtblauw, value: teal}], default: light }
              - { label: Kop, name: heading, widget: string, required: false }
              - { label: Introtekst, name: intro, widget: markdown, required: false }
